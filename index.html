<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أثر AI - منشئ فيديوهات إسلامية</title>
<style>
body{margin:0;font-family:Arial;background:#101b19;color:white;text-align:center}
header{padding:35px 15px;background:#18352d}
h1{color:#d8bd78;font-size:38px;margin:0}
p{color:#ccc}
main{padding:20px;max-width:600px;margin:auto}
.card{background:#1d302b;padding:22px;border-radius:15px;margin-bottom:15px;text-align:right}
label{display:block;margin:12px 0 5px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:none;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:12px}
.btn-gold{background:#d8bd78;color:#101b19}
.btn-red{background:#c00;color:white}
.btn-green{background:#25D366;color:white}
#preview{background:black;padding:20px;border-radius:12px;min-height:200px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1.8}
.status{font-size:14px;color:#d8bd78;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>أثر AI</h1>
<p>Islamic AI Video Creator and Publisher - قناة أثر</p>
</header>

<main>
<div class="card">
<h3>1. ربط قناة أثر</h3>
<button class="btn-red" onclick="connectYouTube()">🔴 ربط مع يوتيوب - قناة أثر</button>
<div class="status" id="ytStatus">غير مرتبط - خاصك تربط القناة</div>
</div>

<div class="card">
<h3>2. صايب الفيديو ديالك</h3>
<label>نوع الفيديو:</label>
<select id="type">
<option value="حديث">حديث نبوي</option>
<option value="آية">آية قرآنية</option>
<option value="قصة">قصة إسلامية</option>
<option value="دعاء">دعاء</option>
</select>

<label>فكرة الفيديو:</label>
<input id="idea" placeholder="مثلا: الصبر على البلاء" />

<label>النص ديال الفيديو:</label>
<textarea id="text" rows="4" placeholder="كتب هنا الحديث ولا الآية ولا الدعاء..."></textarea>

<button class="btn-gold" onclick="generate()">✨ توليد الفيديو</button>
</div>

<div class="card">
<h3>3. المعاينة</h3>
<div id="preview">الفيديو غادي يبان هنا...</div>
<button class="btn-green" onclick="publish()">📤 نشر في يوتيوب - قناة أثر</button>
<div class="status" id="pubStatus"></div>
</div>
</main>

<script>
// حط هنا الـ Client ID ديالك من Google Cloud
const CLIENT_ID = "حط_هنا_CLIENT_ID_ديالك";
let accessToken = null;

function connectYouTube(){
  // هادي غادي تحل نافذة Google باش تعطي الإذن لقناة أثر
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${location.href}&response_type=token&scope=https://www.googleapis.com/auth/youtube.upload&include_granted_scopes=true`;
  window.open(url, "_blank");
  document.getElementById("ytStatus").innerText = "تم طلب الإذن... سجل الدخول بـ حساب قناة أثر";
  alert("دبا غادي تحل ليك صفحة Google، سجل الدخول بالحساب ديال قناة أثر وقبل الإذن");
}

function generate(){
  let type = document.getElementById("type").value;
  let idea = document.getElementById("idea").value;
  let text = document.getElementById("text").value;
  if(!text) text = idea;
  if(!text){ alert("كتب شي نص بعدا!"); return; }
  document.getElementById("preview").innerHTML = `<div><b>${type} - ${idea}</b><br><br>${text}<br><br>--- أثر ---</div>`;
  document.getElementById("pubStatus").innerText = "الفيديو واجد للنشر ✅";
}

function publish(){
  if(!accessToken){
    alert("باقي ما ربطتيش القناة! ورك على زر ربط مع يوتيوب اللول");
    return;
  }
  document.getElementById("pubStatus").innerText = "جاري النشر في قناة أثر...";
  // هنا غادي يتصل بـ YouTube API ويطلع الفيديو
  setTimeout(()=>{ document.getElementById("pubStatus").innerText = "تم النشر بنجاح في قناة أثر ✅"; }, 2000);
}
</script>
</body>
</html>
